TASK: TrainingMMF

DATASET:
  FEATURE_DATASET:
    TYPE: OcrFeatureDataset
    BATCH_SIZE: 64
    WORKERS: 0
    FEATURE_PATH:
      FEATURES: ./features/vinvl_vinvl
      SCENE_TEXT: ./features/swintextspotter
      FASTTEXT: ./features/fasttext
      EDGE: null
      IMAGE: null
    SCENE_TEXT_THRESHOLD: 0.0
    MAX_SCENE_TEXT: 100
    WORD_EMBEDDING: ViFastText
    WORD_EMBEDDING_CACHE: null

  DICT_DATASET:
    TYPE: OcrDictionaryDataset
    BATCH_SIZE: 64
    WORKERS: 0
    FEATURE_PATH:
      FEATURES: ./features/vinvl_vinvl
      SCENE_TEXT: ./features/swintextspotter
      FASTTEXT: ./features/fasttext
      EDGE: null
      IMAGE: null
    SCENE_TEXT_THRESHOLD: 0.0
    MAX_SCENE_TEXT: 100
    WORD_EMBEDDING: ViFastText
    WORD_EMBEDDING_CACHE: null

  MIN_FREQ: 1
  VOCAB:
    TYPE: M2Vocab
    TOKENIZER: null
    WORD_EMBEDDING: null
    WORD_EMBEDDING_CACHE: null
    MIN_FREQ: 1
    BOS_TOKEN: <bos>
    EOS_TOKEN: <eos>
    PAD_TOKEN: <pad>
    UNK_TOKEN: <unk>
    IMG_TOKEN: <img>
    FEAT_TOKEN: <feat>
    BOX_TOKEN: <box>
    OCR_TOKEN: <ocr>
    OCR_DET_TOKEN: <ocr_det>
    OCR_REC_TOKEN: <ocr_rec>
    QUESTION_TOKEN: <question>
    ANSWER_TOKEN: <answer>
    JSON_PATH:
      TRAIN: ./features/vitextcaps_train.json
      DEV: ./features/vitextcaps_dev.json
      TEST: ./features/vitextcaps_test.json
  JSON_PATH:
    TRAIN: ./features/vitextcaps_train.json
    DEV: ./features/vitextcaps_dev.json
    TEST: ./features/vitextcaps_test.json

TRAINING:
  CHECKPOINT_PATH: saved_models
  LEARNING_RATE: 1.
  RL_LEARNING_RATE: 0.000005
  WARMUP: 2000
  SCORE: CIDEr
  TRAINING_BEAM_SIZE: 1
  EVALUATING_BEAM_SIZE: 1
  PATIENCE: 5

MODEL:
  ARCHITECTURE: AoA_Model
  NAME: aoa_vinvl_swimspotter
  DEVICE: cuda
  D_MODEL: 768

  REFINE_LAYER:
    NUM_HEADS: 2
    STACK_LAYERS: 2
    FEATURE_SIZE: 2048
    OUT_SIZE: 768

  DECODER:
    EMBEDDING_LAYERS: 2
    NUM_HEADS: 2
    FEATURE_SIZE: 768
    EMBEDDING_SIZE: 768
    VOCAB_SIZE: 15564
